packages:
  - "apps/*"
  - "packages/*"
  # Foldworks primitives consumed from source until they are published.
  - "vendor/foldworks/packages/agent"
  - "vendor/foldworks/packages/diff-viewer"
  - "vendor/foldworks/packages/history"
  - "vendor/foldworks/packages/keyboard"
  - "vendor/foldworks/packages/outliner"
  - "vendor/foldworks/packages/sidebar"
  - "vendor/foldworks/packages/text-intelligence"
  - "vendor/foldworks/packages/ui"

# Mirrors vendor/foldworks/pnpm-workspace.yaml so the vendored packages resolve
# the same Foldkit, Effect, and StyleX versions they are built against.
catalog:
  "@foldkit/devtools": 0.156.0
  "@foldkit/ui": 0.156.0
  "@foldkit/vite-plugin": 0.20.0
  "@lucide/icons": 1.40.0
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/unplugin": 0.19.0
  "@types/node": 24.13.3
  effect: 4.0.0-rc.112
  foldkit: 0.156.0
  typescript: 7.0.2
  vite: 8.2.2
  vitest: 4.1.11

catalogs:
  peers:
    "@foldkit/ui": ^0.156.0
    "@stylexjs/stylex": ^0.19.0
    effect: ^4.0.0-rc.112
    foldkit: ^0.156.0

patchedDependencies:
  foldkit@0.156.0: vendor/foldworks/patches/foldkit@0.156.0.patch

# Alchemy accepts any Effect 4 SQL driver; keep them on the catalog's Effect.
overrides:
  "@effect/platform-node@4.0.4>@effect/platform-node-shared": 4.0.4
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/sql-sqlite-do": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  "@effect/platform-node@4.0.0-rc.112>@effect/platform-node-shared": 4.0.0-rc.112

onlyBuiltDependencies:
  - esbuild
  - workerd
